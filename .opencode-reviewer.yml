project:
  name: RankKernel
  description: A 100% free, zero-bloat WordPress SEO plugin, built to beat Yoast and Rank Math architecturally.
  conventions:
    - "PHP 8.1+, WordPress 6.5+."
    - "PSR-12 inside src/, declare(strict_types=1), namespace RankKernel, one class per file."
    - "rankkernel.php and uninstall.php follow WordPress Coding Standards."
    - "Text domain is exactly rankkernel."
    - "Escape all output, sanitize all input, verify nonces and capabilities on every write."
    - "All SQL uses $wpdb->prepare(); never concatenate variables into a query."
    - "Prefix functions, hooks, options, transients and tables with rankkernel or RankKernel."
    - "One metadata source of truth through the MetaPayload class."
    - "Module gating: metadata off means no metabox and no editor assets."
    - "No build toolchain: hand-written JavaScript against wp.* globals, no npm, JSX, Tailwind or CSS-in-JS."
    - "Hard rule: every line the reviewer writes or proposes must pass vendor/bin/phpcs --standard=phpcs.xml with zero errors and zero warnings. The reviewer's own output obeys the same standard it enforces on the pull request."
    - "Hard rule: never add a phpcs:ignore, never edit phpcs.xml, never lower PHPStan below level 6, never weaken or delete a test, and never run a repo wide phpcbf."
    - "Hard rule: run composer lint, composer stan, composer test and node --check per JavaScript file after every fix, and keep iterating until all four are clean. A fix that leaves a gate red is not done."
    - "Whitespace: one real tab per indentation level, never spaces. WordPress spacing inside control structures, if ( $x ) {, and function calls, foo( $bar )."
    - "WPCS sniffs: Yoda conditions such as true === $flag, elseif not else if, strict comparison when the types are known, single quotes for strings without interpolation, no trailing whitespace, and array arrows aligned in multi line arrays."
    - "Docblocks: every class, method, property and constant carries a WordPress docblock with a short description plus @param, @return and @var tags that match the real types."
    - "Guards: defined( 'ABSPATH' ) || exit; immediately after the namespace declaration in every PHP file under src/. rankkernel.php keeps if ( ! defined( 'ABSPATH' ) ) { exit; } and uninstall.php keeps defined( 'WP_UNINSTALL_PLUGIN' ) || exit;."
    - "src/ and tests/ keep the four documented phpcs.xml exceptions only: PSR-4 file names, camelCase variables, camelCase methods, and short array syntax. Every other WordPress sniff applies. Never widen an exception and never reformat a file the change did not already touch."
    - "docs/ is internal working material and out of review scope."
  commandReference:
    lint: "composer lint"
    stan: "composer stan"
    test: "composer test"
    phpcs: "vendor/bin/phpcs --standard=phpcs.xml"
    js: "for f in assets/js/*.js; do node --check \"$f\"; done"

review:
  inline: true
  effort: balanced
  includePreExisting: false
  failOnSeverity: off
  customRules:
    - "Security: every write path verifies current_user_can() and a nonce, or a REST permission_callback."
    - "Security: never trust superglobals; sanitize on input and escape on output (esc_html, esc_attr, esc_url, wp_kses_post)."
    - "Security: never concatenate variables into SQL; use $wpdb->prepare()."
    - "Security: no eval, no unserialize on user input, no shell execution, no remote file inclusion."
    - "Security: no secrets, credentials, tokens or local socket paths in tracked files."
    - "Security: avoid SSRF; validate and allowlist remote URLs before wp_remote_*."
    - "Standards: WordPress Coding Standards and PSR-12; declare(strict_types=1); an ABSPATH guard in every PHP file."
    - "Standards: prefix every function, hook, option, transient and table with rankkernel or RankKernel; text domain exactly rankkernel."
    - "Standards: any code you propose in a finding, a suggestion block or a fix must itself be WPCS clean and pass phpcs.xml. Real tabs, Yoda conditions, WordPress spacing, complete docblocks. Never propose a snippet that would fail the gate."
    - "Standards: report a WPCS violation with the exact sniff name, for example WordPress.PHP.YodaConditions or WordPress.WhiteSpace.ControlStructureSpacing, plus the file and the line."
    - "Standards: never propose adding a phpcs:ignore, never propose changing phpcs.xml, never propose lowering PHPStan below level 6, and never propose weakening or deleting a test."
    - "Best practice: prefer WordPress APIs over raw PHP (wp_remote_* over curl, wp_parse_url over parse_url)."
    - "Best practice: cache expensive reads with transients or the object cache, keyed by a validator."
    - "Best practice: internationalise every user-facing string; no hardcoded English in rendered output."
    - "Best practice: admin UI is accessible; labels, aria attributes and keyboard support."
    - "Best practice: no type or error suppression, no empty catch blocks."
    - "Features and parity: flag any feature that is a visual shell with no behaviour, or that claims parity without real implementation or tests."
    - "Tests: new behaviour needs tests; never delete or weaken a test to make a check pass."
    - "Never copy competitor code, CSS, markup, icons, class names or wording (rank_math, rank-math-, rm-icon, edfa-d-f)."

audit:
  createIssues: true
  autoFix: false
  targetDirs:
    - src
    - assets
  categories:
    - security
    - performance
    - code-quality
    - maintainability
    - javascript

fix:
  maxIterations: 3
  runChecks:
    - "composer lint && composer stan && composer test"
  checkAllowlist:
    - composer
    - node
    - php

secrets:
  enabled: true
  failCI: false
  # The scanner's generic high entropy rule flags the Google Fonts filename
  # hash in the asset provenance table, because that hash is long and clears
  # the entropy floor. It is a public font file URL, not a credential, so it
  # is allowlisted by its exact public path rather than by excluding the whole
  # file, which would stop genuine secrets in that file from being scanned.
  allowlist:
    - "/fonts\\.gstatic\\.com\\/s\\/[a-z]+\\/v[0-9]+\\/[A-Za-z0-9]+\\.woff2/"

name: Weekly Codebase Audit

on:
  schedule:
    # Weekly full matrix, Monday 02:00 UTC. Four categories x two directories.
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      audit_category:
        description: 'Audit category'
        type: choice
        required: true
        default: all
        options:
          - all
          - security-privacy
          - performance-efficiency
          - code-quality-conventions
          - error-handling-resilience
      audit_target:
        description: 'Audit target directory'
        type: choice
        required: true
        default: all
        options:
          - all
          - src
          - assets

permissions:
  contents: read
  issues: write

jobs:
  select:
    name: Select audit matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build audit matrix
        id: matrix
        env:
          AUDIT_CATEGORY: ${{ github.event.inputs.audit_category || 'all' }}
          AUDIT_TARGET: ${{ github.event.inputs.audit_target || 'all' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          categories = [
              "security-privacy",
              "performance-efficiency",
              "code-quality-conventions",
              "error-handling-resilience",
          ]
          targets = ["src", "assets"]
          category = os.environ.get("AUDIT_CATEGORY", "all")
          target = os.environ.get("AUDIT_TARGET", "all")

          if category not in ["all", *categories]:
              raise SystemExit(f"invalid audit category: {category}")
          if target not in ["all", *targets]:
              raise SystemExit(f"invalid audit target: {target}")

          selected_categories = categories if category == "all" else [category]
          selected_targets = targets if target == "all" else [target]
          matrix = {
              "include": [
                  {"category": item_category, "target": item_target}
                  for item_category in selected_categories
                  for item_target in selected_targets
              ]
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("matrix=" + json.dumps(matrix) + "\n")
          PY

  audit:
    name: Codebase Audit (${{ matrix.category }} / ${{ matrix.target }})
    needs: select
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ai-audit-${{ matrix.category }}-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    steps:
      - name: Diagnose GitHub token (non-secret)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          HTTP_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user)
          echo "GitHub API /user HTTP status: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" != "200" ]; then
            echo "::error::GitHub token cannot authenticate to /user (HTTP ${HTTP_STATUS}). Check GH_PAT validity and scopes."
            exit 1
          fi
          ACTOR=$(gh api /user --jq .login)
          echo "Authenticated actor: ${ACTOR}"
          REMAINING=$(gh api /rate_limit --jq '.resources.core.remaining')
          echo "X-RateLimit-Remaining (core): ${REMAINING}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --ignore-platform-reqs

      - name: AI Codebase Audit
        # Action pin decision (recorded): KEEP v1.23.1 @ 7007f43. PR #342 (v1.24.5 @ 213ea39)
        # is intentionally NOT adopted: unvalidated in this repo and upstream publishes
        # no checksum assets, so a bump requires manual review + a fresh full-SHA pin.
        # Owner action: validate PR #342 in a fork before bumping. Native better-sqlite3
        # is not installed; reviewer uses its JSON storage fallback (degraded).
        uses: nilesh32236/opencode-ai-reviewer@7007f43e413664e319cf5e6c52a4df599e579bb8 # v1.23.1
        with:
          mode: audit
          opencode_version: 'v1.18.31'
          require_opencode_checksum: 'false'
          github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          opencode_api_key: ${{ secrets.OPENCODE_API_KEY }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          model: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          audit_model: ${{ vars.OPENCODE_MODEL || 'opencode/muse-spark-1.3-contributor-free' }}
          audit_create_issues: true
          audit_auto_fix: false
          audit_labels: 'audit'
          audit_prompt_name: ${{ matrix.category }}
          audit_target_dirs: ${{ matrix.target }}
          enable_mcp: false
          project_context: >
            RankKernel is a 100% free, zero-bloat WordPress SEO plugin. Audit the assigned
            category and target directory for security, data integrity, performance,
            standards and WordPress API misuse. Read rankkernel.php and uninstall.php in
            full even when the target is src or assets.
            Evidence: for every externally controlled or persisted value, trace source to
            final sink and record file, line, source, data type, validation, unslashing,
            sanitization/normalization, semantic allowlist, transformation, final sink,
            contextual escaping, capability/nonce and test reference. Input sources include
            $_GET, $_POST, $_FILES, $_SERVER, $_COOKIE, $_SESSION, $_REQUEST, $_ENV, REST
            parameters and JSON bodies, request objects, shortcode/block attributes,
            imported JSON/CSV, database rows, options, metadata, filter output, third-party
            integrations and remote responses. Use one record per occurrence and the
            verdicts PASS, FIXED, ACCEPTED_WITH_REASON, BLOCKED or UNREVIEWED. Report every
            BLOCKED/UNREVIEWED occurrence. Never invent line numbers or evidence, and do
            not classify many occurrences with one generic explanation.
            Security: missing capability or nonce checks, missing validation,
            sanitization or contextual escaping, unsafe SQL, unsafe deserialization,
            SSRF, open redirects, file upload/path traversal, and secrets in tracked files.
            Nested arrays need recursive type validation. REST JSON bodies need explicit
            validation even with a route schema. Uploads need actual size, extension,
            sniffed MIME/content, path containment and cleanup. $_SERVER request values
            need normalization, control-character stripping, query redaction and
            escaping. Cookies, sessions, database rows, options and metadata are untrusted.
            apply_filters() output is untrusted; sanitize after the final filter with a
            narrow wp_kses() allowlist.
            Distinguish unslashing, sanitization, validation, type checking and escaping.
            esc_html() is not a URL or attribute escaper; esc_url_raw() does not replace
            esc_url() at an HTML sink; wp_kses_post() is not safe for every context;
            absint() is not sufficient validation for every identifier.
            WordPress.org: inspect the historical examples at
            src/Admin/UserProfileField.php:90, src/Admin/SchemaMetabox.php:687 and :944,
            src/Admin/InstantIndexingPage.php:330, src/Admin/NotFoundPage.php:616,
            src/Admin/RedirectsPage.php:732, src/Admin/SettingsPage.php:470,
            src/Admin/MetadataBox.php:1196 and :1213,
            src/Modules/Monitor/Logger.php:262 and
            src/Modules/Redirects/Redirector.php:207, and follow each to its final sink.
            Reproduce the current Plugin Check findings instead of assuming the historical
            ten examples cover them. Check privacy, external-service disclosure, uninstall
            cleanup and multisite/network activation behavior.
            Data integrity: one metadata source of truth through MetaPayload, no second
            store, and correct handling of legacy JSON and serialized rows.
            Performance: unbounded queries, missing pagination or indexes, repeated option
            reads, N+1 loops and missing caching.
            Standards: WPCS, PSR-12, strict_types, the rankkernel or RankKernel prefix, the
            exact rankkernel text domain, and an ABSPATH guard in every PHP file. Report
            the exact sniff name plus file and line.
            Existing issue behavior: keep audit_create_issues enabled, labels unchanged,
            and do not create duplicate issues for the same finding.
            Report only issues you can point at in the current code, with a real file and
            line and a concrete trigger/outcome. The docs/ directory is internal and out of
            scope.


# RankKernel tagged release: validate, build, attach, deploy.
#
# Trigger: ONLY an owner-pushed version tag matching v* (e.g. v0.1.0).
# The workflow never creates tags itself.
# Branch pushes and merges cannot start a release.
# Pushing a version tag is the owner's authorization to release.

name: Release Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate, Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out the exact tagged commit with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Require the tag to belong to main branch history
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${{ github.sha }}" origin/main \
            || { echo "Tag commit ${{ github.sha }} is not reachable from origin/main; refusing to release."; exit 1; }
          echo "Tag commit is on main branch history."

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Validate tag matches plugin version and Stable Tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          test -n "$VER" || { echo "Empty version from tag $TAG"; exit 1; }

          PLUGIN_VER="$(grep -m1 '^[[:space:]]*\*[[:space:]]*Version:' rankkernel.php | sed 's/.*Version:[[:space:]]*//')"
          STABLE="$(grep -m1 -i '^[[:space:]]*Stable tag:' readme.txt | sed 's/.*:[[:space:]]*//')"

          echo "Tag: $TAG / plugin header: $PLUGIN_VER / Stable tag: $STABLE"

          test "$PLUGIN_VER" = "$VER" || { echo "Plugin header version mismatch"; exit 1; }
          test "$STABLE" = "$VER" || { echo "Stable Tag mismatch"; exit 1; }

          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: PHP syntax check
        run: |
          set -euo pipefail
          find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Build deterministic release ZIP
        env:
          RK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          python3 - <<'PYEOF'
          import fnmatch, os, subprocess, time, zipfile

          patterns = open('.distignore', encoding='utf-8').read().splitlines()

          def ignored(path):
              for raw in patterns:
                  p = raw.strip()
                  if not p:
                      continue
                  if p.endswith('/'):
                      d = p[:-1]
                      if path == d or path.startswith(d + '/'):
                          return True
                  elif p.startswith('/'):
                      if path == p[1:]:
                          return True
                  elif fnmatch.fnmatchcase(path, p) or path == p or path.startswith(p + '/'):
                      return True
              return False

          files = []

          for dirpath, dirs, fs in os.walk('.'):
              rel = os.path.relpath(dirpath, '.')
              rel = '' if rel == '.' else rel

              dirs[:] = sorted(
                  d for d in dirs
                  if not ignored((rel + '/' + d).lstrip('/'))
              )

              for f in sorted(fs):
                  p = (rel + '/' + f).lstrip('/')
                  if not ignored(p):
                      files.append(p)

          files.sort()

          commit_time = int(
              subprocess.check_output(
                  ['git', 'log', '-1', '--format=%ct']
              ).decode().strip()
          )

          date_time = time.gmtime(commit_time)[:6]
          slug = 'rankkernel'
          out = slug + '-' + os.environ['RK_VERSION'] + '.zip'

          with zipfile.ZipFile(
              out, 'w', zipfile.ZIP_DEFLATED, compresslevel=9
          ) as z:
              for p in files:
                  info = zipfile.ZipInfo(
                      f'{slug}/{p}',
                      date_time=date_time
                  )
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.create_system = 3
                  info.external_attr = 0o100644 << 16
                  info.internal_attr = 0
                  info.extra = b''
                  info.comment = b''

                  with open(p, 'rb') as fh:
                      z.writestr(
                          info,
                          fh.read(),
                          compress_type=zipfile.ZIP_DEFLATED,
                          compresslevel=9
                      )

          print(f'built {out} with {len(files)} files')
          PYEOF

      - name: Verify package contents
        run: |
          set -euo pipefail

          ZIP="rankkernel-${{ steps.version.outputs.version }}.zip"
          test -f "$ZIP"

          TOPS="$(unzip -Z1 "$ZIP" | cut -d/ -f1 | sort -u)"
          test "$TOPS" = "rankkernel" || {
            echo "Unexpected top-level: $TOPS"
            exit 1
          }

          unzip -t "$ZIP" > /dev/null

          unzip -p "$ZIP" rankkernel/rankkernel.php \
            | grep -q "Version: ${{ steps.version.outputs.version }}"

          unzip -p "$ZIP" rankkernel/readme.txt \
            | grep -qi "Stable tag: ${{ steps.version.outputs.version }}"

          echo "Package verified: $(unzip -Z1 "$ZIP" | wc -l) files under rankkernel/"

      - name: SHA-256 checksum
        run: |
          set -euo pipefail
          sha256sum "rankkernel-${{ steps.version.outputs.version }}.zip" | tee SHA256SUMS

      - name: Upload package artifact for the deploy job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rankkernel-release
          path: |
            rankkernel-*.zip
            SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with ZIP and checksum
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: RankKernel ${{ steps.version.outputs.version }}
          body: RankKernel ${{ steps.version.outputs.version }} release package and SHA-256 checksum. WordPress.org deployment uses the same verified package.
          files: |
            rankkernel-*.zip
            SHA256SUMS
          fail_on_unmatched_files: true

  deploy:
    name: Deploy to WordPress.org
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read

    # This environment can hold deployment-specific secrets or protection rules.
    # Without required reviewers, it does not pause for manual approval.
    environment: wordpress.org-production

    steps:
      - name: Check out the exact tagged commit for WordPress.org assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      - name: Download the exact verified package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: rankkernel-release

      - name: Verify checksum and unpack the identical package
        run: |
          set -euo pipefail

          sha256sum -c SHA256SUMS

          rm -rf build
          mkdir build

          unzip -q rankkernel-*.zip -d build

          test -d build/rankkernel

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # stable
        with:
          generate-zip: false
        env:
          SLUG: rankkernel
          BUILD_DIR: build/rankkernel
          ASSETS_DIR: .wordpress-org
          VERSION: ${{ needs.build.outputs.version }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}

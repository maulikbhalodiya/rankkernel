name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: WPCS, PHPStan & PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2, cs2pr
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate composer.json
        run: composer validate --strict

      - name: Dependency audit
        run: composer audit --locked

      - name: PHP syntax
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: WordPress Coding Standards
        run: vendor/bin/phpcs --standard=phpcs.xml --report=checkstyle | cs2pr

      - name: PHPStan (level 6)
        run: composer stan

      - name: PHPUnit
        run: composer test

      - name: JavaScript tests and syntax
        run: |
          composer test:js
          find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

  breadcrumb-kses:
    name: Breadcrumb KSES Integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP and WP-CLI
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.3'
          tools: composer:v2, wp-cli
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Provision WordPress and run real KSES test
        run: |
          set -euo pipefail
          WP_PATH=/tmp/rankkernel-wp
          wp core download --version=7.1.4 --path="$WP_PATH" --force
          wp config create --path="$WP_PATH" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --path="$WP_PATH" --url=http://localhost:8080 --title=RankKernel-CI --admin_user=admin --admin_password=Admin-2026! --admin_email=admin@example.test --skip-email
          ln -s "$GITHUB_WORKSPACE" "$WP_PATH/wp-content/plugins/rankkernel"
          wp plugin activate rankkernel --path="$WP_PATH"
          wp eval-file "$GITHUB_WORKSPACE/tests/Integration/breadcrumb-kses.php" --path="$WP_PATH"

  removed-work:
    name: Removed Work Guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Full history, the guard compares the branch against its merge base.
          fetch-depth: 0

      - name: Fail a pull request that silently removes work
        env:
          RK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RK_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash tools/guard-large-deletions.sh

  security:
    name: Psalm Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Psalm security scan
        uses: docker://ghcr.io/psalm/psalm-security-scan
        with:
          report_file: psalm.sarif

      - name: Check report
        id: report
        if: always()
        run: |
          test -s psalm.sarif
          python3 -c 'import json; d=json.load(open("psalm.sarif", encoding="utf-8")); assert isinstance(d.get("runs"), list)'
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF
        if: always() && steps.report.outputs.exists == 'true'
        uses: github/codeql-action/upload-sarif@fddeee1a7ece751b577e409a89057319e3172939 # v4
        with:
          sarif_file: psalm.sarif
